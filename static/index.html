<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>SynapseQuant OS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #09090b; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    
    .glass-panel { background: rgba(18, 18, 20, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(24, 24, 27, 0.55); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.06); }

    .perspective-1000 { perspective: 1000px; }
    .card-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-zinc-100 pb-28 pt-4 relative">

  <div class="max-w-7xl mx-auto px-4 relative z-10">
    
    <!-- HEADER AVEC COMMUTATEUR PEA / CTO EN 1 CLIC -->
    <header class="glass-panel rounded-3xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center gap-3">
      <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
            <i class="fa-solid fa-atom text-white text-lg"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight">Synapse<span class="text-emerald-400">Quant</span></h1>
            <p class="text-[10px] text-zinc-400 font-mono" id="market-mood">Initialisation du Terminal OS...</p>
          </div>
        </div>

        <!-- TELEGRAM MOBILE -->
        <button onclick="openTelegramModal()" class="md:hidden px-3 py-1.5 rounded-2xl bg-zinc-900 border border-zinc-700/60 text-sky-400 text-xs font-mono">
          <i class="fa-paper-plane"></i>
        </button>
      </div>

      <!-- TOGGLE 1-CLICK PEA / CTO -->
      <div class="flex items-center gap-3 bg-zinc-950 p-1.5 rounded-2xl border border-zinc-800 w-full md:w-auto justify-center">
        <button onclick="setAccountMode('PEA')" id="btn-mode-pea" class="flex-1 md:flex-none px-4 py-1.5 rounded-xl text-xs font-mono font-bold transition-all bg-emerald-500 text-zinc-950 shadow-lg shadow-emerald-500/20">
          <i class="fa-solid fa-piggy-bank mr-1.5"></i>PEA (Europe)
        </button>
        <button onclick="setAccountMode('CTO')" id="btn-mode-cto" class="flex-1 md:flex-none px-4 py-1.5 rounded-xl text-xs font-mono text-zinc-400 hover:text-white transition-all">
          <i class="fa-solid fa-globe mr-1.5"></i>CTO (Monde)
        </button>
      </div>
      
      <button onclick="openTelegramModal()" class="hidden md:flex px-3.5 py-2 rounded-2xl bg-zinc-900 border border-zinc-700/60 text-sky-400 text-xs font-mono items-center gap-2 active:scale-95 transition">
        <i class="fa-paper-plane"></i> <span>Alertes</span>
      </button>
    </header>

    <!-- SPINNER -->
    <div id="loading" class="flex flex-col items-center justify-center py-20">
      <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500 mb-3"></i>
      <p class="text-xs text-zinc-400 font-mono">Chargement des Marchés en direct...</p>
    </div>

    <!-- ONGLET 1 : MARCHÉS -->
    <div id="tab-opportunites" class="tab-content space-y-4">
      <div class="glass-panel rounded-2xl p-3 flex justify-between items-center">
        <div class="flex gap-2 overflow-x-auto no-scrollbar text-xs font-mono">
          <button onclick="filterSector('ALL')" class="sector-btn px-3 py-1.5 rounded-xl bg-indigo-600 text-white font-bold whitespace-nowrap">Tous les Secteurs</button>
          <button onclick="filterSector('Tech')" class="sector-btn px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 whitespace-nowrap border border-zinc-800">Tech & IA</button>
          <button onclick="filterSector('Luxe')" class="sector-btn px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 whitespace-nowrap border border-zinc-800">Luxe</button>
          <button onclick="filterSector('Finance')" class="sector-btn px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 whitespace-nowrap border border-zinc-800">Finance</button>
          <button onclick="filterSector('Énergie')" class="sector-btn px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 whitespace-nowrap border border-zinc-800">Énergie</button>
          <button onclick="filterSector('Santé')" class="sector-btn px-3 py-1.5 rounded-xl bg-zinc-900 text-zinc-400 whitespace-nowrap border border-zinc-800">Santé</button>
        </div>
      </div>

      <div id="grid-opportunites" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <!-- ONGLET 2 : MARKOWITZ -->
    <div id="tab-markowitz" class="tab-content hidden space-y-5">
      <div class="glass-panel rounded-3xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-base font-bold flex items-center gap-2"><i class="fa-solid fa-chart-pie text-emerald-400"></i>Allocation Markowitz</h2>
          <span id="markowitz-account-badge" class="px-2.5 py-1 rounded-full text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold">MODE PEA</span>
        </div>
        
        <div class="flex gap-2 mb-6">
          <button onclick="loadMarkowitz('defensif')" class="px-4 py-2 bg-zinc-900 text-zinc-300 rounded-xl text-xs font-mono border border-zinc-700 w-full">Prudent</button>
          <button onclick="loadMarkowitz('equilibre')" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs font-mono border border-indigo-500 w-full">Équilibré</button>
          <button onclick="loadMarkowitz('offensif')" class="px-4 py-2 bg-zinc-900 text-zinc-300 rounded-xl text-xs font-mono border border-zinc-700 w-full">Offensif</button>
        </div>
        <div id="markowitz-results" class="space-y-3 font-mono text-xs"></div>
      </div>
    </div>

    <!-- ONGLET 3 : VISION TRADINGVIEW -->
    <div id="tab-chart" class="tab-content hidden space-y-4">
      <div class="glass-panel rounded-3xl p-4">
        <div class="flex gap-2 mb-4 overflow-x-auto pb-2 no-scrollbar" id="chart-ticker-selector"></div>
        <div id="tv-chart-container" class="h-[480px] w-full rounded-2xl overflow-hidden border border-zinc-800"></div>
      </div>
    </div>

    <!-- ONGLET 4 : PAPER TRADING -->
    <div id="tab-portfolio" class="tab-content hidden space-y-5">
      <div class="glass-panel rounded-3xl p-6">
        <div class="flex justify-between items-center mb-6">
          <div>
            <span class="text-[10px] text-zinc-500 font-mono uppercase">Capital Virtuel Dispo</span>
            <h2 class="text-3xl font-bold font-mono text-emerald-400" id="virtual-cash">10 000.00 €</h2>
          </div>
          <button onclick="resetPortfolio()" class="text-xs text-rose-400 bg-rose-950/40 border border-rose-800/50 px-3 py-2 rounded-2xl font-mono">Reset 10k€</button>
        </div>
        <div id="portfolio-positions" class="space-y-3 font-mono text-xs"></div>
      </div>
    </div>

    <!-- ONGLET 5 : QUANT -->
    <div id="tab-backtest" class="tab-content hidden space-y-5">
      <div class="glass-panel rounded-3xl p-6">
        <h2 class="text-base font-bold mb-3"><i class="fa-solid fa-calculator text-indigo-400 mr-2"></i>Backtest & Monte-Carlo</h2>
        <div class="flex gap-2 mb-5">
          <select id="backtest-select" class="bg-zinc-900 text-white font-mono text-xs border border-zinc-700 p-3 rounded-2xl w-full">
            <option value="MC.PA">LVMH (MC.PA)</option>
          </select>
          <button onclick="runQuantSimulations()" class="bg-indigo-600 text-white text-xs font-bold px-6 py-3 rounded-2xl font-mono">Calculer</button>
        </div>
        <div id="backtest-results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </div>

  </div>

  <!-- TELEGRAM MODAL -->
  <div id="telegram-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
    <div class="glass-panel rounded-3xl p-6 max-w-md w-full space-y-4">
      <h3 class="text-base font-bold"><i class="fa-paper-plane text-sky-400 mr-2"></i>Alertes Telegram</h3>
      <input type="text" id="tg-token" placeholder="Bot Token" class="w-full bg-zinc-900 border border-zinc-700 text-xs p-3 rounded-xl text-white font-mono">
      <input type="text" id="tg-chatid" placeholder="Chat ID" class="w-full bg-zinc-900 border border-zinc-700 text-xs p-3 rounded-xl text-white font-mono">
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeTelegramModal()" class="px-4 py-2 text-xs text-zinc-400">Annuler</button>
        <button onclick="saveAndTestTelegram()" class="px-4 py-2 bg-sky-600 text-xs font-bold text-white rounded-xl">Activer</button>
      </div>
    </div>
  </div>

  <!-- NAVIGATION FIXE -->
  <nav class="fixed bottom-0 left-0 w-full bg-zinc-950/90 backdrop-blur-2xl border-t border-zinc-800/80 z-40">
    <div class="flex justify-around items-center py-3 max-w-md mx-auto text-center">
      <button onclick="switchTab('opportunites')" id="nav-opportunites" class="nav-btn flex flex-col items-center text-emerald-400">
        <i class="fa-solid fa-house text-lg mb-0.5"></i>
        <span class="text-[9px] font-bold uppercase">Marchés</span>
      </button>
      <button onclick="switchTab('markowitz')" id="nav-markowitz" class="nav-btn flex flex-col items-center text-zinc-500">
        <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
        <span class="text-[9px] font-bold uppercase">Markowitz</span>
      </button>
      <button onclick="switchTab('chart')" id="nav-chart" class="nav-btn flex flex-col items-center text-zinc-500">
        <i class="fa-solid fa-chart-candlestick text-lg mb-0.5"></i>
        <span class="text-[9px] font-bold uppercase">Vision</span>
      </button>
      <button onclick="switchTab('portfolio')" id="nav-portfolio" class="nav-btn flex flex-col items-center text-zinc-500">
        <i class="fa-solid fa-wallet text-lg mb-0.5"></i>
        <span class="text-[9px] font-bold uppercase">Paper</span>
      </button>
      <button onclick="switchTab('backtest')" id="nav-backtest" class="nav-btn flex flex-col items-center text-zinc-500">
        <i class="fa-solid fa-microchip text-lg mb-0.5"></i>
        <span class="text-[9px] font-bold uppercase">Quant</span>
      </button>
    </div>
  </nav>

  <script>
    let globalData = [];
    let currentAccountMode = 'PEA'; // PEA par défaut ou CTO
    let currentSectorFilter = 'ALL';
    let currentChartTicker = "MC.PA";
    let portfolio = JSON.parse(localStorage.getItem("paper_portfolio")) || { cash: 10000, positions: [] };

    // BASCULEUR DE MODE PEA / CTO EN 1 CLIC
    function setAccountMode(mode) {
      currentAccountMode = mode;
      
      const btnPea = document.getElementById('btn-mode-pea');
      const btnCto = document.getElementById('btn-mode-cto');
      const badgeMarkowitz = document.getElementById('markowitz-account-badge');

      if(mode === 'PEA') {
        btnPea.className = "flex-1 md:flex-none px-4 py-1.5 rounded-xl text-xs font-mono font-bold transition-all bg-emerald-500 text-zinc-950 shadow-lg shadow-emerald-500/20";
        btnCto.className = "flex-1 md:flex-none px-4 py-1.5 rounded-xl text-xs font-mono text-zinc-400 hover:text-white transition-all";
        if(badgeMarkowitz) {
          badgeMarkowitz.className = "px-2.5 py-1 rounded-full text-[10px] font-mono bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold";
          badgeMarkowitz.innerText = "MODE PEA";
        }
      } else {
        btnCto.className = "flex-1 md:flex-none px-4 py-1.5 rounded-xl text-xs font-mono font-bold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/20";
        btnPea.className = "flex-1 md:flex-none px-4 py-1.5 rounded-xl text-xs font-mono text-zinc-400 hover:text-white transition-all";
        if(badgeMarkowitz) {
          badgeMarkowitz.className = "px-2.5 py-1 rounded-full text-[10px] font-mono bg-indigo-950 text-indigo-400 border border-indigo-800 font-bold";
          badgeMarkowitz.innerText = "MODE CTO";
        }
      }

      renderSignals();
      setupChartSelectors();
      populateQuantSelect();
      loadMarkowitz('equilibre');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      const activeTab = document.getElementById('tab-' + tabId);
      if(activeTab) activeTab.classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-emerald-400');
        btn.classList.add('text-zinc-500');
      });
      const activeNav = document.getElementById('nav-' + tabId);
      if(activeNav) {
        activeNav.classList.remove('text-zinc-500');
        activeNav.classList.add('text-emerald-400');
      }

      if(tabId === 'chart') loadTradingViewWidget(currentChartTicker);
      if(tabId === 'markowitz') loadMarkowitz('equilibre');
    }

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        globalData = data;
        const loader = document.getElementById('loading');
        if(loader) loader.style.display = 'none';
        
        document.getElementById('market-mood').innerText = `Marchés : ${globalData.length} Actions Analysées`;
        setAccountMode('PEA'); // Init par défaut
        renderPortfolio();
      })
      .catch(err => {
        document.getElementById('market-mood').innerText = "Mode secours / Hors-ligne";
        document.getElementById('loading').style.display = 'none';
      });

    function filterSector(sector) {
      currentSectorFilter = sector;
      renderSignals();
    }

    function flipCard(cardId) {
      const el = document.getElementById(cardId);
      if(el) el.classList.toggle('card-flipped');
    }

    function renderSignals() {
      const grid = document.getElementById('grid-opportunites');
      if(!grid) return;
      grid.innerHTML = '';

      // Filtrage 1: Mode PEA vs CTO
      let accountFiltered = currentAccountMode === 'PEA' 
        ? globalData.filter(i => i.pea === true)
        : globalData;

      // Filtrage 2: Secteur
      let filtered = currentSectorFilter === 'ALL' 
        ? accountFiltered 
        : accountFiltered.filter(i => i.sector === currentSectorFilter);

      let opps = filtered.sort((a,b) => b.score - a.score);

      opps.forEach((item, index) => {
        const recColor = item.score >= 1.4 ? 'emerald' : (item.score >= 1.0 ? 'cyan' : 'amber');
        const recText = item.score >= 1.4 ? 'ACHETER FORT' : (item.score >= 1.0 ? 'ACHETER' : 'CONSERVER');
        const cardId = `card-${index}`;

        const peaBadge = item.pea 
          ? `<span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 text-[9px] font-mono font-bold">PEA</span>`
          : `<span class="px-2 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-800 text-[9px] font-mono font-bold">CTO</span>`;

        grid.innerHTML += `
          <div class="perspective-1000 h-[360px] cursor-pointer" onclick="flipCard('${cardId}')">
            <div id="${cardId}" class="card-inner w-full h-full relative">
              <div class="card-front absolute inset-0 glass-card rounded-3xl p-5 flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-start mb-2">
                    <span class="text-[9px] font-mono text-${recColor}-400 font-bold uppercase tracking-wider">${recText}</span>
                    <div class="flex items-center gap-1.5">
                      ${peaBadge}
                      <span class="text-[9px] text-zinc-500 font-mono"><i class="fa-solid fa-rotate mr-1"></i>X-Ray</span>
                    </div>
                  </div>
                  <h3 class="text-xl font-bold text-white">${item.entreprise}</h3>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-[10px] font-mono text-zinc-400">${item.ticker}</span>
                    <span class="px-2 py-0.5 rounded bg-zinc-900 text-zinc-500 text-[9px] font-mono">${item.sector}</span>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3 font-mono">
                  <div class="bg-zinc-900/80 p-3 rounded-2xl border border-zinc-800">
                    <span class="text-[9px] text-zinc-500 block">Prix</span>
                    <span class="text-lg text-zinc-100 font-bold">€${item.prix.toFixed(2)}</span>
                  </div>
                  <div class="bg-indigo-950/30 p-3 rounded-2xl border border-indigo-900/40">
                    <span class="text-[9px] text-indigo-300 block">Score IA</span>
                    <span class="text-lg text-${recColor}-400 font-bold">${item.score.toFixed(2)}</span>
                  </div>
                </div>

                <button onclick="event.stopPropagation(); buyPaperTrade('${item.ticker}', ${item.prix})" class="w-full py-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-2xl text-xs font-bold font-mono">
                  Paper Trade (+1 Action)
                </button>
              </div>

              <div class="card-back absolute inset-0 bg-zinc-950 border border-indigo-500/40 rounded-3xl p-5 flex flex-col justify-between font-mono">
                <div>
                  <span class="text-[9px] text-indigo-400 uppercase block mb-2"><i class="fa-solid fa-microchip mr-1"></i>Rayons-X IA</span>
                  <div class="space-y-2 text-xs text-zinc-300">
                    <div class="flex justify-between"><span>Éligibilité:</span><span class="${item.pea?'text-emerald-400':'text-indigo-400'} font-bold">${item.pea?'PEA & CTO':'CTO Uniquement'}</span></div>
                    <div class="flex justify-between"><span>RSI (14j):</span><span class="text-indigo-400">${item.rsi}</span></div>
                    <div class="flex justify-between"><span>SMA 200:</span><span class="text-zinc-200">€${item.sma200}</span></div>
                    <div class="flex justify-between"><span>Secteur:</span><span class="text-zinc-200">${item.sector}</span></div>
                  </div>
                </div>
                <div class="p-3 bg-zinc-900/80 rounded-xl border border-zinc-800 text-[10px] text-zinc-400">
                  Gradient Boosting : Probabilité de hausse à 15j = ${(item.score*50).toFixed(0)}%.
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function setupChartSelectors() {
      const container = document.getElementById('chart-ticker-selector');
      if(!container) return;
      container.innerHTML = '';
      
      let dataset = currentAccountMode === 'PEA' ? globalData.filter(i => i.pea === true) : globalData;
      if(dataset.length > 0) currentChartTicker = dataset[0].ticker;

      dataset.forEach(item => {
        container.innerHTML += `
          <button onclick="changeChartTicker('${item.ticker}')" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-xl text-xs font-mono whitespace-nowrap hover:border-indigo-500 flex-shrink-0">
            ${item.entreprise}
          </button>
        `;
      });
    }

    function changeChartTicker(ticker) { currentChartTicker = ticker; loadTradingViewWidget(ticker); }
    function loadTradingViewWidget(symbol) {
      const container = document.getElementById('tv-chart-container');
      if(!container) return;
      container.innerHTML = '';
      new TradingView.widget({
        "autosize": true, "symbol": symbol, "interval": "D", "timezone": "Europe/Paris",
        "theme": "dark", "style": "1", "locale": "fr", "container_id": "tv-chart-container"
      });
    }

    function populateQuantSelect() {
      const select = document.getElementById('backtest-select');
      if(!select) return;
      select.innerHTML = '';
      let dataset = currentAccountMode === 'PEA' ? globalData.filter(i => i.pea === true) : globalData;
      dataset.forEach(item => {
        select.innerHTML += `<option value="${item.ticker}">${item.entreprise} (${item.ticker})</option>`;
      });
    }

    function loadMarkowitz(profile) {
      const div = document.getElementById('markowitz-results');
      if(!div) return;
      div.innerHTML = `<div class="text-center py-4 text-zinc-500">Calcul Markowitz (${currentAccountMode})...</div>`;
      
      fetch(`/api/markowitz?risk_profile=${profile}&account_type=${currentAccountMode}`)
        .then(r => r.json())
        .then(res => {
          div.innerHTML = '';
          if(res.allocation) {
            res.allocation.forEach(item => {
              div.innerHTML += `
                <div class="glass-card p-3 rounded-2xl flex justify-between items-center">
                  <div>
                    <span class="font-bold text-white">${item.entreprise}</span>
                    <span class="text-[10px] text-zinc-500 block">${item.ticker}</span>
                  </div>
                  <div class="text-right">
                    <span class="text-emerald-400 font-bold text-sm block">${item.weight_pct}%</span>
                    <span class="text-[9px] ${item.pea?'text-emerald-400':'text-indigo-400'} font-mono">${item.pea?'PEA':'CTO'}</span>
                  </div>
                </div>
              `;
            });
          }
        });
    }

    function buyPaperTrade(ticker, price) {
      if(portfolio.cash < price) return alert("Capital virtuel insuffisant !");
      portfolio.cash -= price;
      portfolio.positions.push({ ticker, buyPrice: price, date: new Date().toLocaleDateString('fr-FR') });
      localStorage.setItem("paper_portfolio", JSON.stringify(portfolio));
      renderPortfolio();
    }

    function renderPortfolio() {
      const cashEl = document.getElementById('virtual-cash');
      if(cashEl) cashEl.innerText = portfolio.cash.toFixed(2) + " €";
      const container = document.getElementById('portfolio-positions');
      if(!container) return;
      container.innerHTML = '';
      if(portfolio.positions.length === 0) container.innerHTML = `<p class="text-zinc-600 text-center py-4">Aucune position ouverte.</p>`;

      portfolio.positions.forEach((pos, idx) => {
        const live = globalData.find(i => i.ticker === pos.ticker);
        const livePrice = live ? live.prix : pos.buyPrice;
        const pnl = (((livePrice - pos.buyPrice) / pos.buyPrice) * 100).toFixed(2);
        
        container.innerHTML += `
          <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center">
            <div>
              <span class="font-bold text-white">${pos.ticker}</span>
              <span class="text-[10px] text-zinc-500 block">€${pos.buyPrice.toFixed(2)}</span>
            </div>
            <div class="text-right">
              <span class="${pnl>=0?'text-emerald-400':'text-rose-400'} font-bold block">${pnl>=0?'+':''}${pnl}%</span>
              <button onclick="sellPaperTrade(${idx}, ${livePrice})" class="text-[10px] text-rose-400 underline">Vendre</button>
            </div>
          </div>
        `;
      });
    }

    function sellPaperTrade(idx, currentPrice) {
      portfolio.cash += currentPrice;
      portfolio.positions.splice(idx, 1);
      localStorage.setItem("paper_portfolio", JSON.stringify(portfolio));
      renderPortfolio();
    }

    function resetPortfolio() {
      portfolio = { cash: 10000, positions: [] };
      localStorage.setItem("paper_portfolio", JSON.stringify(portfolio));
      renderPortfolio();
    }

    function runQuantSimulations() {
      const ticker = document.getElementById('backtest-select').value;
      if(!ticker) return;
      const resultsDiv = document.getElementById('backtest-results');
      resultsDiv.innerHTML = `<div class="col-span-2 text-center py-6 text-zinc-500">Calculs en cours...</div>`;

      Promise.all([
        fetch(`/api/backtest?ticker=${ticker}`).then(r => r.json()),
        fetch(`/api/montecarlo?ticker=${ticker}`).then(r => r.json())
      ]).then(([backtest, mc]) => {
        resultsDiv.innerHTML = `
          <div class="glass-card p-4 rounded-2xl">
            <h4 class="text-xs font-bold text-indigo-400 uppercase mb-2">Backtest 1 An</h4>
            <div class="space-y-1 text-xs font-mono">
              <div class="flex justify-between"><span>Rendement:</span><span class="${backtest.total_return_pct>=0?'text-emerald-400':'text-rose-400'} font-bold">${backtest.total_return_pct}%</span></div>
              <div class="flex justify-between"><span>Win Rate:</span><span class="text-emerald-400 font-bold">${backtest.win_rate_pct}%</span></div>
            </div>
          </div>
          <div class="glass-card p-4 rounded-2xl">
            <h4 class="text-xs font-bold text-purple-400 uppercase mb-2">Monte-Carlo 30j</h4>
            <div class="space-y-1 text-xs font-mono">
              <div class="flex justify-between"><span>Médian (P50):</span><span class="text-zinc-200 font-bold">€${mc.base_case_p50}</span></div>
              <div class="flex justify-between"><span>Optimiste (P90):</span><span class="text-emerald-400 font-bold">€${mc.bull_case_p90}</span></div>
            </div>
          </div>
        `;
      });
    }

    function openTelegramModal() { document.getElementById('telegram-modal').classList.remove('hidden'); }
    function closeTelegramModal() { document.getElementById('telegram-modal').classList.add('hidden'); }
    function saveAndTestTelegram() {
      const token = document.getElementById('tg-token').value;
      const chatid = document.getElementById('tg-chatid').value;
      fetch(`/api/telegram?token=${token}&chat_id=${chatid}&message=🚀 SynapseQuant connecté !`)
        .then(r => r.json()).then(res => { if(res.success) { alert("Alerte envoyée !"); closeTelegramModal(); } });
    }
  </script>
</body>
</html>
